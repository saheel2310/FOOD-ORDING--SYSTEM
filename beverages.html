<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beverages - Indian Breakfast Delights</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    .menu-item {
      transition: transform 0.3s ease;
    }
    .menu-item:hover {
      transform: translateY(-5px);
    }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <!-- Header with Back Button -->
    <div class="flex justify-between items-center mb-8">
      <a href="index.html" class="text-orange-600 hover:text-orange-700 font-semibold">
        ← Back to Home
      </a>
      <h1 class="text-3xl font-bold text-orange-600">Beverages</h1>
    </div>

    <!-- Menu Items Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8" id="menu">
      <!-- Items will be dynamically loaded via JS -->
       <p class="text-gray-500 col-span-full text-center">Loading menu...</p>
    </div>

    <!-- Current Order -->
    <div class="bg-white p-6 rounded-xl shadow-lg mt-10">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">Your Order</h2>
      <div class="space-y-4 mb-6 min-h-[50px]" id="orderList">
         <!-- Order items will be listed here -->
         <p class="text-gray-500 italic">Your order is empty.</p>
      </div>
      <div class="flex justify-between items-center border-t pt-4">
        <div class="text-xl font-bold text-gray-800">Total: ₹<span id="totalAmount">0</span></div>
        <button id="placeOrderBtn" class="bg-orange-500 hover:bg-orange-600 px-6 py-3 rounded-lg text-white font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed">
          Place Order
        </button>
      </div>
    </div>
  </div>

  <!-- DELETED: Removed the large inline script block with hardcoded data and functions -->

  <!-- ADDED: Load api.js and script.js as modules -->
  <script type="module" src="api.js"></script>
  <script type="module" src="script.js"></script>

   <!-- ... rest of the body content ... -->

  <!-- Scripts -->
  <script type="module" src="api.js"></script>
  <script type="module" src="script.js"></script>

  <!-- Initialization Script -->
   <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof window.app?.fetchMenu === 'function') {
         // *** Call with 'beverages' category ***
        window.app.fetchMenu('beverages');
      } else {
        console.error("fetchMenu function not found on window.app. Check script.js loading.");
        document.getElementById('menu').innerHTML = '<p class="text-red-500 col-span-full text-center">Error loading menu function.</p>';
      }

      const placeOrderButton = document.getElementById('placeOrderBtn');
      if (placeOrderButton && typeof window.app?.placeOrder === 'function') {
        placeOrderButton.addEventListener('click', window.app.placeOrder);
      } else {
         console.error("placeOrder function or button not found.");
      }

      if (typeof window.app?.updateCart === 'function') {
           window.app.updateCart();
      } else {
           console.error("updateCart function not found on window.app.")
      }
    });
  </script>
</body>
</html>
